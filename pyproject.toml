[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anduin"
version = "0.1.0"
description = "Personal health/fitness ETL: poll Google Health, Withings, intervals.icu, Liftosaur; land raw immutable data in TimescaleDB; reconcile on read."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aiden Gindin", email = "aiden@aidengindin.com" }]
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.scripts]
anduin = "anduin.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "freezegun>=1.5",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anduin"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "anduin/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
